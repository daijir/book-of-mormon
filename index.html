<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>モルモン書 個人研究ノート</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="モルモン書と John W. Welch Notes をまとめた個人研究ノート。末日聖徒の視点から聖文を深く読み解きます。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      --theme-color: #2b6cb0;
    }

    body {
      font-family: var(--base-font-family);
      line-height: 1.85;
      color: #2d3748;
    }

    .markdown-section {
      max-width: 880px;
      padding: 30px 40px;
    }

    .markdown-section h1 {
      font-size: 2rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.4rem;
      margin-top: 1.5rem;
      color: #1a365d;
    }

    .markdown-section h2 {
      font-size: 1.5rem;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 0.3rem;
      margin-top: 2rem;
      color: #2a4365;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      scroll-margin-top: 1.5rem;
    }

    .markdown-section h3 {
      font-size: 1.25rem;
      color: #2c5282;
    }

    .markdown-section blockquote {
      border-left: 4px solid #3182ce;
      background: #ebf8ff;
      color: #2b6cb0;
      padding: 12px 18px;
      margin: 1.2em 0;
      border-radius: 0 6px 6px 0;
    }

    .markdown-section hr {
      border: 0;
      height: 1px;
      background: #e2e8f0;
      margin: 2.5rem 0;
    }

    .sidebar {
      background-color: #f7fafc;
      border-right: 1px solid #edf2f7;
    }

    .sidebar-nav strong {
      color: #4a5568;
      font-size: 0.9em;
      display: inline-block;
      margin-top: 12px;
    }

    .sidebar-nav ul li a {
      font-size: 14px;
      color: #4a5568;
    }

    .sidebar-nav ul li.active>a {
      color: var(--theme-color);
      font-weight: 600;
    }

    .sidebar .search {
      margin-bottom: 10px;
    }

    .sidebar .search input {
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div id="app">読み込み中...</div>
  <script>
    // Docsify の CSS querySelector エラー (#1-nephi などの数字開始ID) を防止・解決するパッチ
    (function() {
      function safeQuerySelector(orig, context, selector) {
        try {
          return orig.call(context, selector);
        } catch (e) {
          if (typeof selector === 'string' && selector.charAt(0) === '#') {
            var rawId = selector.slice(1);
            return document.getElementById(rawId) ||
                   document.getElementById('_' + rawId) ||
                   document.getElementById(rawId.replace(/-+/g, '-')) ||
                   document.getElementById('_' + rawId.replace(/-+/g, '-'));
          }
          throw e;
        }
      }

      if (typeof Document !== 'undefined') {
        var origDocQS = Document.prototype.querySelector;
        Document.prototype.querySelector = function(selector) {
          return safeQuerySelector(origDocQS, this, selector);
        };
      }
      if (typeof Element !== 'undefined') {
        var origElQS = Element.prototype.querySelector;
        Element.prototype.querySelector = function(selector) {
          return safeQuerySelector(origElQS, this, selector);
        };
      }
    })();

    window.$docsify = {
      name: 'モルモン書 研究ノート',
      repo: 'https://github.com/daijir/book-of-mormon',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '章やキーワードで検索...',
        noData: '見つかりませんでした',
        depth: 3
      },
      pagination: {
        previousText: '前のページ',
        nextText: '次のページ',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: 'エラー',
        successText: 'コピー完了'
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            return content.replace(/>\s*###\s*(?:📖\s*)?Webサイト版のご案内[\s\S]*?(?=\r?\n\s*---|\r?\n\s*##|$)/g, '');
          });

          // アンカーリンク・目次ジャンプの解決関数
          function findTargetHeading(targetId) {
            if (!targetId) return null;
            try {
              // 1. 直接一致
              var el = document.getElementById(targetId);
              if (el) return el;

              // 2. Docsify の先頭アンダースコア（数字開始時の仕様）有無の差異を解決
              if (targetId.startsWith('_')) {
                el = document.getElementById(targetId.substring(1));
              } else {
                el = document.getElementById('_' + targetId);
              }
              if (el) return el;

              // 3. ハイフン連続（-- と -）の差異を解決
              var singleHyphen = targetId.replace(/-+/g, '-');
              el = document.getElementById(singleHyphen) || 
                   document.getElementById('_' + singleHyphen) || 
                   document.getElementById(singleHyphen.replace(/^_/, ''));
              if (el) return el;

              // 4. 見出し要素（h1〜h6）のテキストや正規化IDとのあいまい一致
              var cleanTarget = targetId.toLowerCase().replace(/[^a-z0-9]/g, '');
              var headings = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6');
              for (var i = 0; i < headings.length; i++) {
                var h = headings[i];
                var hId = (h.id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                var hText = (h.textContent || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                if (hId === cleanTarget || hText.indexOf(cleanTarget) !== -1 || cleanTarget.indexOf(hId) !== -1) {
                  return h;
                }
              }
            } catch (err) {
              console.warn('Anchor resolution error:', err);
            }
            return null;
          }

          function scrollToTarget(targetId) {
            var el = findTargetHeading(targetId);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
              return true;
            }
            return false;
          }

          hook.doneEach(function() {
            // URLクエリに id がある場合の自動スクロール
            var queryId = vm.route.query && vm.route.query.id;
            if (queryId) {
              setTimeout(function() {
                scrollToTarget(queryId);
              }, 150);
            }
          });

          hook.ready(function() {
            // 目次やページ内アンカーのタップ/クリックを確実に処理
            document.addEventListener('click', function(e) {
              var a = e.target.closest('a');
              if (!a) return;
              var href = a.getAttribute('href') || '';
              
              var targetId = '';
              var idMatch = href.match(/[?&]id=([^&]+)/);
              if (idMatch) {
                targetId = decodeURIComponent(idMatch[1]);
              } else if (href.startsWith('#') && !href.startsWith('#/')) {
                targetId = decodeURIComponent(href.slice(1));
              }

              if (targetId) {
                var scrolled = scrollToTarget(targetId);
                if (scrolled) {
                  e.preventDefault();
                  var path = vm.route.path;
                  history.pushState(null, '', '#/' + path.replace(/^\//, '') + '?id=' + encodeURIComponent(targetId));
                }
              }
            }, true);
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 全文検索プラグイン -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 画像ズームプラグイン -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- コードコピー機能 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- ページ送り機能 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>

</html>

  <script>
    // Docsify の CSS querySelector エラー (#1-nephi などの数字開始ID) を防止・解決するパッチ
    (function() {
      function safeQuerySelector(orig, context, selector) {
        try {
          return orig.call(context, selector);
        } catch (e) {
          if (typeof selector === 'string' && selector.charAt(0) === '#') {
            var rawId = selector.slice(1);
            return document.getElementById(rawId) ||
              document.getElementById('_' + rawId) ||
              document.getElementById(rawId.replace(/-+/g, '-')) ||
              document.getElementById('_' + rawId.replace(/-+/g, '-'));
          }
          throw e;
        }
      }

      if (typeof Document !== 'undefined') {
        var origDocQS = Document.prototype.querySelector;
        Document.prototype.querySelector = function(selector) {
          return safeQuerySelector(origDocQS, this, selector);
        };
      }
      if (typeof Element !== 'undefined') {
        var origElQS = Element.prototype.querySelector;
        Element.prototype.querySelector = function(selector) {
          return safeQuerySelector(origElQS, this, selector);
        };
      }
    })();

    window.$docsify = {
      name: 'モルモン書個人研究ノート',
      repo: 'https://github.com/daijir/book-of-mormon',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '章やキーワードで検索...',
        noData: '見つかりませんでした',
        depth: 3
      },
      pagination: {
        previousText: '前のページ',
        nextText: '次のページ',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: 'エラー',
        successText: 'コピー完了'
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            return content.replace(/>\s*###\s*(?:📖\s*)?Webサイト版のご案内[\s\S]*?(?=\r?\n\s*---|\r?\n\s*##|$)/g, '');
          });

          // アンカーリンク・目次ジャンプの解決関数
          function findTargetHeading(targetId) {
            if (!targetId) return null;
            try {
              // 1. 直接一致
              var el = document.getElementById(targetId);
              if (el) return el;

              // 2. Docsify の先頭アンダースコア（数字開始時の仕様）有無の差異を解決
              if (targetId.startsWith('_')) {
                el = document.getElementById(targetId.substring(1));
              } else {
                el = document.getElementById('_' + targetId);
              }
              if (el) return el;

              // 3. ハイフン連続（-- と -）の差異を解決
              var singleHyphen = targetId.replace(/-+/g, '-');
              el = document.getElementById(singleHyphen) ||
                document.getElementById('_' + singleHyphen) ||
                document.getElementById(singleHyphen.replace(/^_/, ''));
              if (el) return el;

              // 4. 見出し要素（h1〜h6）のテキストや正規化IDとのあいまい一致
              var cleanTarget = targetId.toLowerCase().replace(/[^a-z0-9]/g, '');
              var headings = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6');
              for (var i = 0; i < headings.length; i++) {
                var h = headings[i];
                var hId = (h.id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                var hText = (h.textContent || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                if (hId === cleanTarget || hText.indexOf(cleanTarget) !== -1 || cleanTarget.indexOf(hId) !== -1) {
                  return h;
                }
              }
            } catch (err) {
              console.warn('Anchor resolution error:', err);
            }
            return null;
          }

          function scrollToTarget(targetId) {
            var el = findTargetHeading(targetId);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
              return true;
            }
            return false;
          }

          hook.doneEach(function() {
            // URLクエリに id がある場合の自動スクロール
            var queryId = vm.route.query && vm.route.query.id;
            if (queryId) {
              setTimeout(function() {
                scrollToTarget(queryId);
              }, 150);
            }
          });

          hook.ready(function() {
            // 目次やページ内アンカーのタップ/クリックを確実に処理
            document.addEventListener('click', function(e) {
              var a = e.target.closest('a');
              if (!a) return;
              var href = a.getAttribute('href') || '';
              var targetId = '';
              var idMatch = href.match(/[?&]id=([^&]+)/);
              if (idMatch) {
                targetId = decodeURIComponent(idMatch[1]);
              } else if (href.startsWith('#') && !href.startsWith('#/')) {
                targetId = decodeURIComponent(href.slice(1));
              }

              if (targetId) {
                var scrolled = scrollToTarget(targetId);
                if (scrolled) {
                  e.preventDefault();
                  var path = vm.route.path;
                  history.pushState(null, '', '#/' + path.replace(/^\//, '') + '?id=' + encodeURIComponent(targetId));
                }
              }
            }, true);
          });
        }
      ]
    }
  </script>

  <script>
    (function () {
      var GITHUB_REPO = 'daijir/book-of-mormon';

      var BOOK_NAMES = {
        '00_special_topics': '特別トピック',
        '01_1nephi': '第1ニーファイ',
        '02_2nephi': '第2ニーファイ',
        '03_jacob': 'ヤコブ書',
        '04_enos': 'エノス書',
        '05_jarom': 'ジャロム書',
        '06_omni': 'オムナイ書',
        '07_wordsofmormon': 'モルモンの言葉',
        '08_mosiah': 'モーサヤ書',
        '09_alma': 'アルマ書',
        '10_helaman': 'ヒラマン書',
        '11_3nephi': '第3ニーファイ',
        '12_4nephi': '第4ニーファイ',
        '13_mormon': 'モルモン書',
        '14_ether': 'エテル書',
        '15_moroni': 'モロナイ書'
      };

      function formatBookFileLabel(filepath) {
        var parts = filepath.split('/');
        var dir = parts[0];
        var fname = parts[1] || '';
        var bookTitle = BOOK_NAMES[dir] || dir;

        var m = fname.match(/^(\d+)(_notes)?\.md$/i);
        if (m) {
          var chapNum = parseInt(m[1], 10);
          var isNotes = !!m[2];
          return bookTitle + ' 第' + chapNum + '章' + (isNotes ? ' (Welch Notes)' : '');
        }
        return bookTitle + ' ' + fname;
      }

      // コミット詳細のファイルを非同期確認するグローバル関数
      window.__checkCommitFiles = function(btn, sha, verse) {
        btn.disabled = true;
        btn.textContent = '確認中...';

        var cacheKey = 'git_commit_files_bom_' + sha;
        var cached = null;
        try {
          var raw = sessionStorage.getItem(cacheKey);
          if (raw) cached = JSON.parse(raw);
        } catch (e) {}

        function handleFiles(files) {
          var mdFiles = (files || []).filter(function(f) {
            return f.filename && f.filename.endsWith('.md') && f.filename !== 'README.md' && f.filename !== '_sidebar.md' && f.filename !== 'blog.md';
          });

          if (mdFiles.length === 0) {
            btn.outerHTML = '<span style="color: #a0aec0; font-size: 0.82rem; margin-top: 10px; display: inline-block;">（マークダウン章ファイルの変更はありません）</span>';
            return;
          }

          var linksHtml = '<div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;">';
          mdFiles.forEach(function(f) {
            var url = '#/' + f.filename.replace(/\.md$/i, '');
            var label = formatBookFileLabel(f.filename);
            if (verse) {
              url += '?verse=' + verse;
              label += ' (' + verse + '節へフォーカス)';
            }
            linksHtml += '<a class="git-blog-link-btn" href="' + url + '">📖 ' + label + ' →</a>';
          });
          linksHtml += '</div>';
          btn.outerHTML = linksHtml;
        }

        if (cached) {
          handleFiles(cached);
          return;
        }

        fetch('https://api.github.com/repos/' + GITHUB_REPO + '/commits/' + sha)
          .then(function(res) {
            if (!res.ok) throw new Error();
            return res.json();
          })
          .then(function(data) {
            try { sessionStorage.setItem(cacheKey, JSON.stringify(data.files || [])); } catch (e) {}
            handleFiles(data.files);
          })
          .catch(function() {
            btn.disabled = false;
            btn.textContent = '確認に失敗しました（再試行）';
          });
      };

      function extractTarget(message) {
        if (!message) return null;

        // 節の抽出: 例 "1:11", "1:4-7", "32:21"
        var verse = null;
        var chapFromVerse = null;
        var verseMatch = message.match(/(\d{1,2})[：:](\d{1,2})/);
        if (verseMatch) {
          chapFromVerse = parseInt(verseMatch[1], 10);
          verse = parseInt(verseMatch[2], 10);
        }

        var aliases = [
          { key: '01_1nephi', names: ['1nephi', '1ニーファイ', '第一ニーファイ', '第1ニーファイ', '1 nephi'] },
          { key: '02_2nephi', names: ['2nephi', '2ニーファイ', '第二ニーファイ', '第2ニーファイ', '2 nephi'] },
          { key: '03_jacob', names: ['jacob', 'ヤコブ'] },
          { key: '04_enos', names: ['enos', 'エノス'] },
          { key: '05_jarom', names: ['jarom', 'ジャロム'] },
          { key: '06_omni', names: ['omni', 'オムナイ'] },
          { key: '07_wordsofmormon', names: ['wordsofmormon', 'モルモンの言葉'] },
          { key: '08_mosiah', names: ['mosiah', 'モーサヤ'] },
          { key: '09_alma', names: ['alma', 'アルマ'] },
          { key: '10_helaman', names: ['helaman', 'ヒラマン'] },
          { key: '11_3nephi', names: ['3nephi', '3ニーファイ', '第三ニーファイ', '第3ニーファイ', '3 nephi'] },
          { key: '12_4nephi', names: ['4nephi', '4ニーファイ', '第四ニーファイ', '第4ニーファイ', '4 nephi'] },
          { key: '13_mormon', names: ['mormon', 'モルモン書', 'モルモン'] },
          { key: '14_ether', names: ['ether', 'エテル'] },
          { key: '15_moroni', names: ['moroni', 'モロナイ'] }
        ];

        var lowerMsg = message.toLowerCase();
        var targetDir = null;
        var targetBookName = null;

        for (var i = 0; i < aliases.length; i++) {
          var item = aliases[i];
          for (var j = 0; j < item.names.length; j++) {
            if (lowerMsg.indexOf(item.names[j]) !== -1) {
              targetDir = item.key;
              targetBookName = BOOK_NAMES[item.key];
              break;
            }
          }
          if (targetDir) break;
        }

        if (targetDir) {
          var chap = chapFromVerse;
          if (!chap) {
            var cMatch = message.match(/(?:第\s*)?([0-9０-９]{1,2})\s*章/);
            if (cMatch) {
              var rawNum = cMatch[1].replace(/[０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
              });
              chap = parseInt(rawNum, 10);
            }
          }
          if (chap) {
            var chapPadded = ('0' + chap).slice(-2);
            var url = '#/' + targetDir + '/' + chapPadded;
            if (verse) url += '?verse=' + verse;
            var lbl = targetBookName + ' 第' + chap + '章' + (verse ? ' (' + verse + '節へフォーカス)' : 'を開く');
            return { url: url, label: lbl };
          }
        }

        return { verseOnly: verse };
      }

      function gitBlogPlugin(hook, vm) {
        var PER_PAGE = 10;
        var currentPage = 1;
        var isLoading = false;
        var allLoaded = false;

        function escapeHtml(text) {
          if (!text) return '';
          return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function formatDate(isoStr) {
          var d = new Date(isoStr);
          if (isNaN(d.getTime())) return isoStr || '';
          var year = d.getFullYear();
          var month = ('0' + (d.getMonth() + 1)).slice(-2);
          var day = ('0' + d.getDate()).slice(-2);
          var hours = ('0' + d.getHours()).slice(-2);
          var minutes = ('0' + d.getMinutes()).slice(-2);
          return year + '年' + month + '月' + day + '日 ' + hours + ':' + minutes;
        }

        function renderCommitItem(commitData) {
          var commit = commitData.commit || {};
          var fullMessage = commit.message || '';
          var lines = fullMessage.split('\n');
          var title = lines[0].trim();
          var bodyLines = lines.slice(1).join('\n').trim();

          var authorInfo = commit.author || commit.committer || {};
          var dateStr = formatDate(authorInfo.date);
          var shaShort = (commitData.sha || '').substring(0, 7);
          var commitUrl = commitData.html_url || ('https://github.com/' + GITHUB_REPO + '/commit/' + commitData.sha);

          var target = extractTarget(fullMessage);
          var actionHtml = '';
          if (target && target.url) {
            actionHtml = '<a class="git-blog-link-btn" href="' + target.url + '">📖 ' + escapeHtml(target.label) + ' →</a>';
          } else {
            var vArg = (target && target.verseOnly) ? target.verseOnly : 0;
            actionHtml = '<button class="git-blog-check-btn" onclick="window.__checkCommitFiles(this, \'' + commitData.sha + '\', ' + vArg + ')">📄 変更されたページを確認</button>';
          }

          var html = '<div class="git-blog-item">';
          html += '  <div class="git-blog-dot"></div>';
          html += '  <div class="git-blog-card">';
          html += '    <div class="git-blog-header">';
          html += '      <span class="git-blog-date">📅 ' + escapeHtml(dateStr) + '</span>';
          html += '      <a class="git-blog-sha" href="' + escapeHtml(commitUrl) + '" target="_blank" rel="noopener noreferrer" title="GitHubでコミットを確認">#' + escapeHtml(shaShort) + ' ↗</a>';
          html += '    </div>';
          html += '    <div class="git-blog-title">' + escapeHtml(title) + '</div>';
          if (bodyLines) {
            html += '    <div class="git-blog-body">' + escapeHtml(bodyLines) + '</div>';
          }
          html += '    <div class="git-blog-actions">' + actionHtml + '</div>';
          html += '  </div>';
          html += '</div>';
          return html;
        }

        function loadCommits(container, page) {
          if (isLoading || allLoaded) return;
          isLoading = true;

          var loadingEl = container.querySelector('#git-blog-loading');
          var loadMoreBtn = container.querySelector('#git-blog-loadmore');
          var endEl = container.querySelector('#git-blog-end');
          var errorEl = container.querySelector('#git-blog-error');
          var listEl = container.querySelector('#git-blog-list');

          if (loadingEl) loadingEl.style.display = 'flex';
          if (loadMoreBtn) loadMoreBtn.style.display = 'none';
          if (errorEl) errorEl.style.display = 'none';

          var cacheKey = 'git_blog_bom_p' + page;
          var cachedData = null;
          try {
            var raw = sessionStorage.getItem(cacheKey);
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed.timestamp && (Date.now() - parsed.timestamp < 10 * 60 * 1000)) {
                cachedData = parsed.data;
              }
            }
          } catch (e) {}

          var handleData = function(data) {
            isLoading = false;
            if (loadingEl) loadingEl.style.display = 'none';

            if (!Array.isArray(data) || data.length === 0) {
              allLoaded = true;
              if (endEl) endEl.style.display = 'block';
              return;
            }

            var htmlChunk = '';
            for (var i = 0; i < data.length; i++) {
              htmlChunk += renderCommitItem(data[i]);
            }
            if (listEl) {
              listEl.insertAdjacentHTML('beforeend', htmlChunk);
            }

            if (data.length < PER_PAGE) {
              allLoaded = true;
              if (endEl) endEl.style.display = 'block';
            } else {
              if (loadMoreBtn) loadMoreBtn.style.display = 'inline-block';
            }
          };

          if (cachedData) {
            handleData(cachedData);
            return;
          }

          fetch('https://api.github.com/repos/' + GITHUB_REPO + '/commits?per_page=' + PER_PAGE + '&page=' + page)
            .then(function (res) {
              if (!res.ok) {
                if (res.status === 403) {
                  throw new Error('GitHub APIの利用上限に達しました。しばらく経ってから再度お試しください。');
                }
                throw new Error('コミットの取得に失敗しました (HTTP ' + res.status + ')');
              }
              return res.json();
            })
            .then(function (data) {
              try {
                sessionStorage.setItem(cacheKey, JSON.stringify({
                  timestamp: Date.now(),
                  data: data
                }));
              } catch (e) {}
              handleData(data);
            })
            .catch(function (err) {
              isLoading = false;
              if (loadingEl) loadingEl.style.display = 'none';
              if (errorEl) {
                errorEl.textContent = err.message || 'エラーが発生しました。';
                errorEl.style.display = 'block';
              }
            });
        }

        hook.doneEach(function () {
          // 1. ブログページの描画
          var container = document.getElementById('git-blog-container');
          if (container) {
            currentPage = 1;
            isLoading = false;
            allLoaded = false;

            var loadMoreBtn = container.querySelector('#git-blog-loadmore');
            if (loadMoreBtn) {
              loadMoreBtn.onclick = function () {
                currentPage++;
                loadCommits(container, currentPage);
              };
            }

            loadCommits(container, currentPage);
            return;
          }

          // 2. 章ページでの節フォーカス処理
          var hash = window.location.hash || '';
          var verseMatch = hash.match(/[?&]verse=(\d+)/);
          if (verseMatch) {
            var targetVerse = verseMatch[1];
            setTimeout(function() {
              var contentEl = document.querySelector('.markdown-section');
              if (!contentEl) return;

              var candidates = contentEl.querySelectorAll('blockquote, p, strong, li');
              var foundEl = null;
              var regex = new RegExp('(^|\\s|[*])' + targetVerse + '([\\.\\s]|$)');
              for (var i = 0; i < candidates.length; i++) {
                var el = candidates[i];
                var text = el.textContent || '';
                if (regex.test(text)) {
                  var bq = el.closest('blockquote');
                  foundEl = bq || el;
                  break;
                }
              }

              if (foundEl) {
                foundEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                foundEl.classList.remove('git-focus-highlight');
                void foundEl.offsetWidth;
                foundEl.classList.add('git-focus-highlight');
              }
            }, 350);
          }
        });
      }

      window.$docsify = window.$docsify || {};
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(gitBlogPlugin);
    })();
  </script>
</body>
